name: Apply Mission Control logger patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-mission-control-logger.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply logger patch and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("uar/api/routers/mission_control.py")
          text = p.read_text()

          if "import logging" not in text:
              text = text.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport logging\n\n",
              )

          if "logger = logging.getLogger(__name__)" not in text:
              text = text.replace(
                  "security = HTTPBearer(auto_error=False)\n\n",
                  "logger = logging.getLogger(__name__)\n\n"
                  "security = HTTPBearer(auto_error=False)\n\n",
              )

          p.write_text(text)

          workflow = Path(".github/workflows/apply-mission-control-logger.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uar/api/routers/mission_control.py .github/workflows/apply-mission-control-logger.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(lint): restore mission control logger"
          git push
