name: UAR Validation

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation scope to run'
        required: true
        default: 'foundation'
        type: choice
        options:
          - foundation
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Foundation Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run pytest (foundation scope)
        run: make validate PYTHON=python

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build web app
        run: npm run build

  operator-dashboard-tests:
    name: Operator Dashboard Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/operator-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build operator dashboard
        run: npm run build

  web-svelte-tests:
    name: Web Svelte Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-svelte
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-svelte/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build web svelte
        run: npm run build

      - name: Check
        run: npm run check
