name: D4E Runtime Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "uar/**"
      - "scripts/validate_d4e_runtime_smoke.sh"
      - "scripts/d4e/**"
      - "Makefile"
      - ".github/workflows/d4e-runtime-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "uar/**"
      - "scripts/validate_d4e_runtime_smoke.sh"
      - "scripts/d4e/**"
      - "Makefile"
      - ".github/workflows/d4e-runtime-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  d4e-runtime-smoke:
    name: D4E runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      UAR_AUTH_MODE: api_key
      API_KEYS: local-admin-key:admin:ci-d4e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run D4E runtime smoke
        run: make d4e-runtime-smoke

      - name: Upload D4E smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: d4e-runtime-smoke
          path: reports/d4e/
          if-no-files-found: warn
