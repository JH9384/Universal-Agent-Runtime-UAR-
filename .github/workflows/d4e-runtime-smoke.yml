name: D4E Runtime Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "uar/**"
      - "scripts/validate_d4e_runtime_smoke.sh"
      - "scripts/d4e/**"
      - "Makefile"
      - ".github/workflows/d4e-runtime-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "uar/**"
      - "scripts/validate_d4e_runtime_smoke.sh"
      - "scripts/d4e/**"
      - "Makefile"
      - ".github/workflows/d4e-runtime-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  d4e-runtime-smoke:
    name: D4E runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      UAR_AUTH_MODE: api_key
      API_KEYS: local-admin-key:admin:ci-d4e

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run D4E runtime smoke
        run: make d4e-runtime-smoke

      - name: Upload D4E smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: d4e-runtime-smoke
          path: reports/d4e/
          if-no-files-found: warn
