name: burnin-hardening

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC

jobs:
  hardening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          make install PYTHON=python

      - name: Ensure artifact directory exists
        run: mkdir -p artifacts/hardening

      - name: Run hardening tests
        run: |
          set -o pipefail
          .venv/bin/pytest tests/hardening -q --tb=short 2>&1 | tee artifacts/hardening/hardening-tests.log

      - name: Upload hardening test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-tests-log
          path: artifacts/hardening/hardening-tests.log
          retention-days: 7

      - name: Run ordering stress test (5 random seeds)
        run: |
          set -o pipefail
          : > artifacts/hardening/ordering-stress.log
          for seed in 1 2 3 7 42; do
            echo "=== Randomly seed=$seed ===" | tee -a artifacts/hardening/ordering-stress.log
            .venv/bin/pytest tests/ --ignore=tests/conformance/test_invariants.py \
              -q --tb=line --timeout=60 --randomly-seed=$seed 2>&1 | tee -a artifacts/hardening/ordering-stress.log
          done

      - name: Upload ordering stress log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordering-stress-log
          path: artifacts/hardening/ordering-stress.log
          retention-days: 7

      - name: Run gate target
        run: |
          set -o pipefail
          make gate PYTHON=python 2>&1 | tee artifacts/hardening/gate.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-gate-log
          path: artifacts/hardening/gate.log
          retention-days: 7

      - name: Run burn-in probe
        run: |
          .venv/bin/python scripts/hardening/burnin_probe.py

      - name: Upload burn-in artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burnin-artifacts
          path: artifacts/hardening
          retention-days: 7
