name: burnin-hardening

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          make install PYTHON=python

      - name: Run hardening tests
        run: |
          .venv/bin/pytest tests/hardening -q --tb=short

      - name: Run ordering stress test (5 random seeds)
        run: |
          for seed in 1 2 3 7 42; do
            echo "=== Randomly seed=$seed ==="
            .venv/bin/pytest tests/ --ignore=tests/conformance/test_invariants.py \
              -q --tb=line --timeout=60 --randomly-seed=$seed || exit 1
          done

      - name: Run gate target
        run: |
          make gate PYTHON=python

      - name: Ensure artifact directory exists
        run: mkdir -p artifacts/hardening

      - name: Run burn-in probe
        run: |
          .venv/bin/python scripts/hardening/burnin_probe.py

      - name: Upload burn-in artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burnin-artifacts
          path: artifacts/hardening
