name: UAR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Validate backend with coverage
        run: make test-coverage PYTHON=python

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 7

      - name: Lint backend
        run: make lint-py PYTHON=python

      - name: Check release version alignment
        run: make check-version PYTHON=python

      - name: Validate UOR artifacts
        run: make validate-uor PYTHON=python

      - name: Run benchmark (non-blocking)
        run: .venv/bin/python tests/performance/benchmark_skills.py
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: benchmark_results.json
          retention-days: 14

      - name: Flaky test detection (3 random seeds)
        run: |
          for seed in 1 7 42; do
            echo "=== Randomly seed=$seed ==="
            .venv/bin/pytest tests/ --ignore=tests/conformance/test_invariants.py \
              -q --tb=line --timeout=60 -m 'not performance' \
              --randomly-seed=$seed || exit 1
          done

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run performance tests without coverage instrumentation
        run: make test-performance PYTHON=python

  optional-dependency-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ['advanced', 'doc-processing', 'agent-orchestration']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # No .venv here: this job tests importability of optional deps in a
      # clean system environment, not the full test suite that requires .venv.
      - name: Install optional dependency group
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extra }}]"

      - name: Import optional integration modules
        run: |
          python - <<'PY'
          import importlib

          modules = {
              "advanced": ["crewai", "dagster", "autogen", "qdrant_client"],
              "doc-processing": ["unstructured", "docling"],
              "agent-orchestration": ["crewai", "autogen"],
          }
          for module in modules["${{ matrix.extra }}"]:
              importlib.import_module(module)
              print(f"Imported {module}")
          PY

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  operator-dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/operator-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  web-svelte-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-svelte
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web-svelte/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  sign-uor-artifacts:
    runs-on: ubuntu-latest
    needs: [python-tests, performance-tests, web-tests, operator-dashboard-tests, web-svelte-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write  # Sigstore OIDC is scoped only to this signing job.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Sigstore
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          make install PYTHON=python

      - name: Sign UOR artifacts
        run: |
          # Sign each UOR artifact
          for file in third_party/uor/*.json third_party/uor/*.ttl; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              cosign sign-blob --yes \
                --output-signature "${file}.sig" \
                --output-certificate "${file}.cert" \
                "$file"
            fi
          done

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uor-signatures
          path: |
            third_party/uor/*.sig
            third_party/uor/*.cert
          retention-days: 90

      - name: Update UOR alignment metrics
        run: |
          # Record successful signing for monitoring
          VERSION=$(tr -d '\n' < VERSION)
          .venv/bin/python -c "
          from uar.api.uor_alignment_metrics import get_uor_alignment_metrics
          metrics = get_uor_alignment_metrics()
          metrics.record_alignment_check(
              local_version='v${VERSION}',
              upstream_version='v${VERSION}',
              validation_passed=True
          )
          print('UOR alignment metrics updated')
          "
