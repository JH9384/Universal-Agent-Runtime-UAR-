name: UAR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write  # Required for Sigstore OIDC token

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Validate backend with coverage
        run: make test-coverage PYTHON=python

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 7

      - name: Lint backend
        run: make lint-py PYTHON=python

      - name: Check release version alignment
        run: make check-version PYTHON=python

      - name: Validate UOR artifacts
        run: make validate-uor PYTHON=python

      - name: Run benchmark (non-blocking)
        run: .venv/bin/python tests/performance/benchmark_skills.py
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: benchmark_results.json
          retention-days: 14

      - name: Flaky test detection (3 random seeds)
        run: |
          for seed in 1 7 42; do
            echo "=== Randomly seed=$seed ==="
            .venv/bin/pytest tests/ --ignore=tests/conformance/test_invariants.py \
              -q --tb=line --timeout=60 --randomly-seed=$seed || exit 1
          done

  optional-dependency-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ['advanced', 'doc-processing', 'agent-orchestration']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # No .venv here: this job tests importability of optional deps in a
      # clean system environment, not the full test suite that requires .venv.
      - name: Install optional dependency group
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extra }}]"

      - name: Import optional integration modules
        run: |
          python - <<'PY'
          import importlib

          modules = {
              "advanced": ["crewai", "dagster", "autogen", "qdrant_client"],
              "doc-processing": ["unstructured", "docling"],
              "agent-orchestration": ["crewai", "autogen"],
          }
          for module in modules["${{ matrix.extra }}"]:
              importlib.import_module(module)
              print(f"Imported {module}")
          PY

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p ../../artifacts/uar-ci/web
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee ../../artifacts/uar-ci/web/npm-ci.log

      - name: Upload web npm ci log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-npm-ci-log
          path: artifacts/uar-ci/web/npm-ci.log
          retention-days: 7

      - name: Run tests
        run: |
          mkdir -p ../../artifacts/uar-ci/web
          set -o pipefail
          npm run test:run 2>&1 | tee ../../artifacts/uar-ci/web/test-run.log

      - name: Upload web test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-log
          path: artifacts/uar-ci/web/test-run.log
          retention-days: 7

      - name: Build
        run: |
          mkdir -p ../../artifacts/uar-ci/web
          set -o pipefail
          npm run build 2>&1 | tee ../../artifacts/uar-ci/web/build.log

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: artifacts/uar-ci/web/build.log
          retention-days: 7

  operator-dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p ../../artifacts/uar-ci/operator-dashboard
          set -o pipefail
          npm ci 2>&1 | tee ../../artifacts/uar-ci/operator-dashboard/npm-ci.log

      - name: Upload operator dashboard npm ci log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-dashboard-npm-ci-log
          path: artifacts/uar-ci/operator-dashboard/npm-ci.log
          retention-days: 7

      - name: Run tests
        run: |
          mkdir -p ../../artifacts/uar-ci/operator-dashboard
          set -o pipefail
          npx vitest run 2>&1 | tee ../../artifacts/uar-ci/operator-dashboard/test-run.log

      - name: Upload operator dashboard test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-dashboard-test-log
          path: artifacts/uar-ci/operator-dashboard/test-run.log
          retention-days: 7

      - name: Build
        run: |
          mkdir -p ../../artifacts/uar-ci/operator-dashboard
          set -o pipefail
          npm run build 2>&1 | tee ../../artifacts/uar-ci/operator-dashboard/build.log

      - name: Upload operator dashboard build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-dashboard-build-log
          path: artifacts/uar-ci/operator-dashboard/build.log
          retention-days: 7

  web-svelte-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-svelte
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          mkdir -p ../../artifacts/uar-ci/web-svelte
          set -o pipefail
          npm ci 2>&1 | tee ../../artifacts/uar-ci/web-svelte/npm-ci.log

      - name: Upload web-svelte npm ci log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-svelte-npm-ci-log
          path: artifacts/uar-ci/web-svelte/npm-ci.log
          retention-days: 7

      - name: Run tests
        run: |
          mkdir -p ../../artifacts/uar-ci/web-svelte
          set -o pipefail
          npm run test:run -- --passWithNoTests 2>&1 | tee ../../artifacts/uar-ci/web-svelte/test-run.log

      - name: Upload web-svelte test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-svelte-test-log
          path: artifacts/uar-ci/web-svelte/test-run.log
          retention-days: 7

      - name: Build
        run: |
          mkdir -p ../../artifacts/uar-ci/web-svelte
          set -o pipefail
          npm run build 2>&1 | tee ../../artifacts/uar-ci/web-svelte/build.log

      - name: Upload web-svelte build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-svelte-build-log
          path: artifacts/uar-ci/web-svelte/build.log
          retention-days: 7

      - name: Check
        run: |
          mkdir -p ../../artifacts/uar-ci/web-svelte
          set -o pipefail
          npm run check 2>&1 | tee ../../artifacts/uar-ci/web-svelte/check.log

      - name: Upload web-svelte check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-svelte-check-log
          path: artifacts/uar-ci/web-svelte/check.log
          retention-days: 7

  sign-uor-artifacts:
    runs-on: ubuntu-latest
    needs: [python-tests, web-tests, operator-dashboard-tests, web-svelte-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write  # For uploading signatures
      id-token: write  # For Sigstore OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sigstore
        uses: sigstore/cosign-installer@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          make install PYTHON=python

      - name: Sign UOR artifacts
        run: |
          # Sign each UOR artifact
          for file in third_party/uor/*.json third_party/uor/*.ttl; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              cosign sign-blob --yes \
                --output-signature "${file}.sig" \
                --output-certificate "${file}.cert" \
                "$file"
            fi
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: uor-signatures
          path: |
            third_party/uor/*.sig
            third_party/uor/*.cert
          retention-days: 90

      - name: Update UOR alignment metrics
        run: |
          # Record successful signing for monitoring
          VERSION=$(tr -d '\n' < VERSION)
          .venv/bin/python -c "
          from uar.api.uor_alignment_metrics import get_uor_alignment_metrics
          metrics = get_uor_alignment_metrics()
          metrics.record_alignment_check(
              local_version='v${VERSION}',
              upstream_version='v${VERSION}',
              validation_passed=True
          )
          print('UOR alignment metrics updated')
          "
