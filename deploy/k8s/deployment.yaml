apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar-api
  namespace: uar
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: uar
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: uar
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: uar
          image: uar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uar-config
          env:
            - name: UAR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: UAR_ENCRYPTION_KEY
            - name: METRICS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: METRICS_API_KEY
            - name: UAR_PAGERDUTY_ROUTING_KEY
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: UAR_PAGERDUTY_ROUTING_KEY
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: REDIS_URL
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: DATABASE_URL
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: runs
              mountPath: /app/runs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: runs
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: uar
              app.kubernetes.io/component: api
