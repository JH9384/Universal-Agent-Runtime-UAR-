apiVersion: v1
kind: Secret
metadata:
  name: uar-secrets
  namespace: uar
  labels:
    app.kubernetes.io/name: uar
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  UAR_ENCRYPTION_KEY: "replace-me-in-production"
  METRICS_API_KEY: "replace-me-in-production"
  UAR_PAGERDUTY_ROUTING_KEY: ""
  # Redis / Postgres (optional)
  REDIS_URL: ""
  DATABASE_URL: ""
